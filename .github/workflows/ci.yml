name: CI

on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        java:
          - '8'
          - '11'
          - '17'
          - '21'
          - '25'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - java: '8'
            maven-args: '-P osgi-tests,kotlin'
          - java: '11'
            maven-args: ''
          - java: '17'
            maven-args: '-P modern-jvm'
          - java: '21'
            maven-args: '-P modern-jvm'
          - java: '25'
            maven-args: "-P modern-jvm -pl '!awaitility-groovy'"
      fail-fast: false
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@main
      - name: Set up JDK
        uses: actions/setup-java@main
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: 'maven'
      - name: Build
        run: mvn --no-transfer-progress -B clean install ${{ matrix.maven-args }}
